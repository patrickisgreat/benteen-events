# CI — lint, typecheck, unit tests, and a real production build on every PR.
#
# The pipeline itself lives in actions-toolkit; this file only says which knobs
# this repo needs. Change the pipeline there and this repo picks it up.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    uses: patrickisgreat/actions-toolkit/.github/workflows/node-ci.yml@main
    with:
      node-version: '22'
      package-manager: npm
      typecheck-command: typecheck
      # This repo's script is `test`, not the toolkit's `test:ci` default.
      test-command: test
      # No Playwright here yet — the guest RSVP path is the one worth adding first.
      e2e: none
      # Vitest isn't configured for coverage output, so there'd be nothing to upload.
      coverage: false
    secrets: inherit

  # A schema change is the least reversible thing this app does, so the PR shows
  # exactly what a merge would apply, as a comment, before anyone approves it.
  db-plan:
    if: github.event_name == 'pull_request'
    uses: patrickisgreat/actions-toolkit/.github/workflows/deploy-supabase.yml@main
    with:
      dry-run: true
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit

  preview:
    if: github.event_name == 'pull_request'
    needs: [ci]
    uses: patrickisgreat/actions-toolkit/.github/workflows/deploy-vercel.yml@main
    with:
      environment: preview
      build-env: |
        SUPABASE_URL=SUPABASE_URL
        SUPABASE_KEY=SUPABASE_KEY
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
